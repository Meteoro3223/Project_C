name: proyecto-c

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proyecto_c}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proyecto_c_dev}
      POSTGRES_DB: ${POSTGRES_DB:-proyecto_c_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-proyecto_c} -d $${POSTGRES_DB:-proyecto_c_dev}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
